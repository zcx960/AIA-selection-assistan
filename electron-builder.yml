appId: com.selectionassistant.lite
productName: AIA划词助手
icon: build/icon.png
npmRebuild: false
afterPack: scripts/after-pack.mjs
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: build/icon.png
  # Windows window icon: same artwork with the rounded corners flattened onto
  # the background colour, so the shell never fills them in white.
  - from: build/icon-win.png
    to: build/icon-win.png
asarUnpack:
  - node_modules/selection-hook/**
  - node_modules/uiohook-napi/**
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: AIA-Selection-Assistant-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  extendInfo:
    NSScreenCaptureUsageDescription: AIA划词助手需要屏幕录制权限来截取和录制您选择的区域。
    NSAppleEventsUsageDescription: AIA划词助手 uses accessibility APIs to detect selected text.
    NSSystemAdministrationUsageDescription: AIA划词助手 needs accessibility permission to detect selected text.
dmg:
  artifactName: AIA-Selection-Assistant-${version}-${arch}.${ext}
win:
  # Full-bleed opaque variant: small sizes stored as 32bpp BMP entries so the
  # legacy shell icon paths (taskbar / title bar) get real alpha-capable data
  # instead of PNG entries they cannot read.
  icon: build/icon-win.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: AIA-Selection-Assistant-Setup-${version}.${ext}
portable:
  artifactName: AIA-Selection-Assistant-Portable-${version}.${ext}
